{% compress css %}
    {{ comment_form.media.css }}
    <style media="all">
        .featherlight {
            z-index: 1000;
        }

        .comments-root > .comment + .comment {
            margin-top: 1rem;
        }

        .comment-form .wmd-wrapper,
        .reply-comment .wmd-wrapper,
        #comment-edit .wmd-wrapper {
            display: grid;
            gap: 0.875rem;
        }

        .comment-form .wmd-panel:first-child,
        .reply-comment .wmd-panel:first-child,
        #comment-edit .wmd-panel:first-child {
            border: 1px solid #cbd5e1;
            border-radius: 1rem;
            background: #fff;
            overflow: hidden;
            box-shadow: 0 1px 2px rgb(15 23 42 / 0.06);
        }

        .comment-form .wmd-button-bar,
        .reply-comment .wmd-button-bar,
        #comment-edit .wmd-button-bar {
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
            border-bottom: 1px solid #e2e8f0;
            padding: 0.625rem 0.75rem;
        }

        .comment-form .wmd-button-row,
        .reply-comment .wmd-button-row,
        #comment-edit .wmd-button-row {
            margin: 0;
            height: 1.75rem;
        }

        .comment-form .wmd-input,
        .reply-comment .wmd-input,
        #comment-edit .wmd-input {
            min-height: 14rem;
            height: 14rem;
            border: 0;
            padding: 1rem 1.125rem;
            resize: vertical;
            font-family: "Fira Mono", "Roboto Mono", monospace !important;
            font-size: 0.95rem;
            line-height: 1.65;
            color: #0f172a;
        }

        .comment-form .wmd-input:focus,
        .reply-comment .wmd-input:focus,
        #comment-edit .wmd-input:focus {
            outline: none;
        }

        .comment-form .dmmd-preview,
        .reply-comment .dmmd-preview,
        #comment-edit .dmmd-preview {
            border: 1px solid #cbd5e1;
            border-radius: 1rem;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
        }

        .comment-form .dmmd-preview-update,
        .reply-comment .dmmd-preview-update,
        #comment-edit .dmmd-preview-update {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            height: auto;
            padding: 0.75rem 1rem;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .comment-form .dmmd-preview-update::before,
        .reply-comment .dmmd-preview-update::before,
        #comment-edit .dmmd-preview-update::before {
            content: "\f06e";
            font-family: "Font Awesome 6 Pro";
            font-weight: 900;
        }

        .comment-form .dmmd-preview-content,
        .reply-comment .dmmd-preview-content,
        #comment-edit .dmmd-preview-content {
            min-height: 6rem;
            padding: 1rem 1.125rem 1.125rem;
            background: #f8fafc;
        }

        .revision-text p:first-child {
            margin-top: 0;
        }

        .revision-text p:last-child {
            margin-bottom: 0;
        }

        .featherlight-edit .featherlight-content {
            background: #fff;
            padding: 0;
            border-radius: 1rem;
            border: 1px solid #d4d4d8;
            overflow: hidden;
            max-width: 42rem;
            width: min(42rem, calc(100vw - 2rem));
        }

        .featherlight-edit .featherlight-close-icon {
            color: #0f172a;
        }

        .header-comment .close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 9999px;
            color: #fff;
            background: rgb(255 255 255 / 0.08);
        }

        .header-comment .close:hover {
            background: rgb(255 255 255 / 0.16);
        }

        .reply-comment form {
            width: 100%;
        }

        .reply-comment textarea,
        #comment-edit textarea {
            width: 100%;
            min-height: 9rem;
            border-radius: 1rem;
            border: 1px solid #cbd5e1;
            background: #fff;
            padding: 0.75rem 1rem;
        }

        .reply-comment textarea:focus,
        #comment-edit textarea:focus {
            outline: 2px solid #bfdbfe;
            border-color: #3b82f6;
        }

        .previous-revision, .next-revision {
            color: inherit;
        }

        .comment:target {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgb(37 99 235 / 0.12);
        }

        .comment-body p:first-child,
        .bad-comment-body p:first-child {
            margin-top: 0;
        }

        .comment-body p:last-child,
        .bad-comment-body p:last-child {
            margin-bottom: 0;
        }

        .bad-comment {
            opacity: 0.58;
        }

        .bad-comment:hover {
            opacity: 1;
            -webkit-transform: translatez(0);
            -moz-transform: translatez(0);
            -ms-transform: translatez(0);
            -o-transform: translatez(0);
            transform: translatez(0);
        }

        @media (prefers-color-scheme: dark) {
            .comment-form .wmd-panel:first-child,
            .reply-comment .wmd-panel:first-child,
            #comment-edit .wmd-panel:first-child,
            .comment-form .dmmd-preview,
            .reply-comment .dmmd-preview,
            #comment-edit .dmmd-preview {
                border-color: #334155;
                background: #0f172a;
            }

            .comment-form .wmd-button-bar,
            .reply-comment .wmd-button-bar,
            #comment-edit .wmd-button-bar {
                background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
                border-bottom-color: #334155;
            }

            .comment-form .wmd-input,
            .reply-comment .wmd-input,
            #comment-edit .wmd-input {
                background: #0f172a;
                color: #fff;
            }

            .comment-form .dmmd-preview-content,
            .reply-comment .dmmd-preview-content,
            #comment-edit .dmmd-preview-content {
                background: #020617;
                color: #e2e8f0;
            }

            .featherlight-edit .featherlight-content {
                background: #0f172a;
                border-color: #334155;
            }

            .featherlight-edit .featherlight-close-icon {
                color: #fff;
            }

            .reply-comment textarea,
            #comment-edit textarea {
                border-color: #334155;
                background: #0f172a;
                color: #fff;
            }

            .reply-comment textarea:focus,
            #comment-edit textarea:focus {
                outline-color: rgb(30 64 175 / 0.45);
                border-color: #60a5fa;
            }
        }
    </style>
{% endcompress %}

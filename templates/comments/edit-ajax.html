<div class="rounded-2xl bg-white p-5 dark:bg-dark-content">
    <div class="mb-4 flex items-center justify-between border-b border-slate-200 pb-3 dark:border-slate-700">
        <div>
            <h3 class="text-lg font-semibold text-slate-900 dark:text-white">{{ _('Edit comment') }}</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400">{{ _('Update your comment and save the new revision.') }}</p>
        </div>
    </div>
    <div>
        <form id="comment-edit" action="{{ request.get_full_path() }}" method="post" class="flex flex-col gap-4">
            <span style="display: none" class="comment-id">{{ comment.id }}</span>
            <span style="display: none" class="read-back">{{ url('comment_content', comment.id) }}</span>
            {% csrf_token %}
            {% if form.non_field_errors() or form.body.errors %}
                <div class="form-errors rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-900 dark:border-rose-900 dark:bg-rose-950/40 dark:text-rose-100">
                    {{ form.non_field_errors() }}
                    {{ form.body.errors }}
                </div>
            {% endif %}
            <div class="field [&_textarea]:min-h-36 [&_textarea]:w-full [&_textarea]:rounded-2xl [&_textarea]:border [&_textarea]:border-slate-300 [&_textarea]:bg-white [&_textarea]:px-4 [&_textarea]:py-3 [&_textarea]:text-sm [&_textarea]:text-slate-900 [&_textarea]:shadow-sm dark:[&_textarea]:border-slate-700 dark:[&_textarea]:bg-slate-900 dark:[&_textarea]:text-white">
                {{ form.body }}
            </div>
            <button type="submit" class="inline-flex items-center justify-center gap-2 self-start rounded-xl bg-blue-600 px-5 py-3 font-semibold text-white transition hover:bg-blue-700">
                <i class="fa-duotone fa-floppy-disk"></i>
                <div class="content">
                    {{ _('Edit comment') }}
                </div>
            </button>
        </form>
    </div>
</div>
